[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winproladder-mcp"
version = "0.11.0"
description = "Tools for inspecting, parsing, and encoding FATEK WinProLadder LDR files."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "WinProLadder MCP contributors" }]
dependencies = [
    "mcp>=1.26,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.12",
]

[project.scripts]
winproladder-mcp = "winproladder_mcp.server:main"
winproladder-setup = "winproladder_mcp.setup:main"

[tool.hatch.build.targets.sdist]
exclude = ["/.codex/config.toml", "/artifacts", "/dist", "/.venv"]

[tool.hatch.build.targets.wheel]
packages = ["src/winproladder_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["winproladder_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["winproladder_mcp"]
mypy_path = "src"
