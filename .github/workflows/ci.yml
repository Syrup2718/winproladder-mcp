name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            validation: quick
          - os: macos-latest
            validation: quick
          - os: ubuntu-latest
            validation: full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - name: Shared project validation
        run: uv run python scripts/validate.py --${{ matrix.validation }}
      - name: Preserve validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-${{ runner.os }}
          path: tmp/validation
          if-no-files-found: warn
          retention-days: 7
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Workspace "${{ runner.temp }}/Ladder Work"
      - name: Install on macOS or Linux
        if: runner.os != 'Windows'
        run: sh install.sh "${{ runner.temp }}/Ladder Work"
